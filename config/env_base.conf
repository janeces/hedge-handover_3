# The variables that will be used by scripts called by a systemd service can't rely on variable expansion
# or have comments after the variable assignment.
# Install
HEDGE_DEVICE_ID=GW00003971  # Id of the device
# Directory where the majority of the code should be installed in.
BASE_PATH=/data/IJS/io_install_test
TMP_PATH=/tmp/hedge  # Path where the database and other temporary files will be stored.
HOST_UNAME=root  # Username for the target device | - We connect to the device by sshpass -p <device pwd> $HOST_UNAME@$HOST_NAME
HOST_NAME=123.345.6.78  # Address of the device.  |
HOST_PWD=your_password  # Password to access the device.
CERTIFICATE_NAME=operato-mqttca.crt  # Name of the .crt certificate file to be used for MQTT communication.
# Install standard directories - these rely on the standard system filesystem structure.
# If changed, the .service files and .sh scripts associated with them need to be adjusted
CONFIG_DIR=/etc/hedge_device_io  # Path where the env.conf will be installed. If this is changed, service files that specify this directory need to be changed as well.
SERVICE_PATH=/etc/systemd/system  # Standard directory where service files are stored in the OS.
SCRIPT_PATH=/usr/local/hedge_device_io  # Where the .sh scripts associated with services are installed.
# Sensors
SAMPLE_INTERVAL=60  # How often to sample the sensors [s].
# Weather
WEATHER_INTERFACE=mqtt  # How to obtain MC measurements: local - over RS485, mqtt - over MQTT connection
WEATHER_MQTT_TOPIC=mobile/mas/weather_data/70100
# MC device
MC_INTERFACE=net  # How to obtain MC measurements: net, mqtt, http, file, serial, tcp-client, udp
MC_HOSTNAME=localhost  # IP of the MC device (localhost for testing).             |--net
MC_PORT=12000  # Port to which the MC device sends data.                          |/
MC_CONTROL_UNIT=MC032992  #  controlUnit ID of the MC device in the XML message.  |-- mqtt
MC_MQTT_TOPIC=Operato/Trafoflex/MC705A  # MQTT topic for MC device data.          |/
MC_HTTP_URL=http://127.0.0.1:8080/mc.xml  # URL that returns MC XML payload.      |--http
MC_HTTP_POLL_INTERVAL=5  # Poll period in seconds for MC_INTERFACE=http.           |/
MC_HTTP_TIMEOUT=10  # HTTP timeout in seconds for MC_INTERFACE=http.
MC_FILE_PATH=/tmp/mc_latest.xml  # Path to local file containing MC XML payload.   |--file
MC_FILE_POLL_INTERVAL=2  # Poll period in seconds for MC_INTERFACE=file.           |/
MC_SERIAL_PORT=/dev/ttyUSB0  # Serial/TTY path for MC XML stream.                 |--serial
MC_SERIAL_BAUDRATE=9600  # Baudrate for MC_INTERFACE=serial.                      |
MC_SERIAL_TIMEOUT=1  # Read timeout in seconds for MC_INTERFACE=serial.            |/
MC_TCP_HOSTNAME=127.0.0.1  # Remote TCP host streaming MC XML payload.            |--tcp-client
MC_TCP_PORT=12001  # Remote TCP port for MC_INTERFACE=tcp-client.                  |
MC_TCP_CONNECT_TIMEOUT=10  # Connect timeout in seconds for MC_INTERFACE=tcp-client.
MC_TCP_READ_TIMEOUT=5  # Read timeout in seconds for MC_INTERFACE=tcp-client.      |
MC_TCP_RETRY_SLEEP=3  # Reconnect sleep in seconds for MC_INTERFACE=tcp-client.    |/
MC_UDP_HOSTNAME=0.0.0.0  # Local UDP bind host for incoming MC XML datagrams.     |--udp
MC_UDP_PORT=12002  # Local UDP bind port for MC_INTERFACE=udp.                     |
MC_UDP_TIMEOUT=5  # Socket timeout in seconds for MC_INTERFACE=udp.                |/
# Temperature probe
TEMP_PROBE_DIR=/sys/bus/w1/devices  # Directory where the temperature probe file resides.
TEMP_PROBE_AMBIENT_NAME=28-e6ce7d0a6461  # Name of the ambient temperature probe as seen by the filesystem.
TEMP_PROBE_TLT_NAME=28-e6ce7d0a6461  # Name of the temperature probe for top liquid temperature verification as seen by the filesystem.
# Upload
UPLOAD_TOPIC=hedgeiot/eg
# Model path
# Path from the project root to the model used for Trafoflex.
MODEL_PATH=models/6001-TP_ŽELEZNO.pb
# Scripts
# These shouldn't be changed, unless the project structure changes. DB scripts run the database and IC scripts run DTR compute.
DB_SCRIPT_TRAFOFLEX=src/device_io/trafoflex/main.py
DB_SCRIPT_DYTHERA=src/device_io/dythera/main.py
IC_SCRIPT_TRAFOFLEX=src/device_io/trafoflex/ic_script.py
IC_SCRIPT_DYTHERA=src/device_io/dythera/ic_script.py
SERVICE_LOCAL_PATH=service  # Project directory where service files are stored.
